<script>
/* Comunicación con el servidor (Apps Script) por fetch, igual que la app de registro de viajes.
   Mantiene la forma google.script.run.withSuccessHandler(...).withFailureHandler(...).funcion(args). */
const API_URL = "https://script.google.com/macros/s/AKfycbz9-miexOJHOrgyTcb_KDHlUgGjPS2T0HFTzqXpswygxTczqLLJgrdCkPGmj49sFDQxNQ/exec";
window.google = { script: { get run(){
  let ok = () => {}, fail = () => {};
  const p = new Proxy({}, { get(_, nombre){
    if (nombre === "withSuccessHandler") return f => { ok = f; return p; };
    if (nombre === "withFailureHandler") return f => { fail = f; return p; };
    return (...args) => {
      fetch(API_URL, { method: "POST", body: JSON.stringify({ accion: nombre, args }) })
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(j => { if (j && j.ok) ok(j.valor); else fail(new Error((j && j.error) || "Error del servidor")); })
        .catch(e => fail(new Error(/Failed to fetch|NetworkError|Load failed/i.test(String(e && e.message)) ? "Sin conexión con el servidor" : (e && e.message) || "Error")));
    };
  } });
  return p;
} } };
</script>

function enviarGuardado(){
  if (GUARDANDO){ PENDIENTE = true; return; }
  GUARDANDO = true;
  google.script.run
    .withSuccessHandler(r => { GUARDANDO = false;
      if (r.ok){ VERSION = r.version; ESTADO = "Guardado "+hhmm(); pintarPie(); if (PENDIENTE){ PENDIENTE = false; save(); } }
      else { PENDIENTE = false; alert("Otro administrador guardó cambios"+(r.por?` (${r.por})`:"")+" mientras editabas. Se recargan los datos del servidor; repite tu último cambio."); iniciar(); } })
    .withFailureHandler(e => { GUARDANDO = false; if (/vencida/i.test(e && e.message)){ TOKEN = ""; pantallaLogin("Tu sesión venció. Ingresa de nuevo (tu último cambio no se guardó)."); return; } ESTADO = "ERROR al guardar: "+(e && e.message ? e.message : e); pintarPie(); })
    .guardarDatos(TOKEN, VERSION, JSON.stringify(D));
}

/* ================= Utilidades ================= */
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso = d => d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const hoy = () => iso(new Date());
const addDays = (s,n) => { const d = new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); };
const diff = (a,b) => Math.round((new Date(b+"T12:00:00") - new Date(a+"T12:00:00"))/86400000);
const num = v => (v === "" || v == null || isNaN(+v)) ? null : +v;
const fkm = n => n == null ? "—" : Number(n).toLocaleString("es-CL")+" km";
const fclp = n => "$"+Math.round(n||0).toLocaleString("es-CL");
const fdate = s => { if(!s) return "—"; const [y,m,d] = s.split("-"); return `${+d}/${+m}/${y}`; };
const MESES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const camion = p => D.camiones.find(c => c.pat === p);
const parDe = c => c && c.par ? camion(c.par) : null;
const esTractoC = c => /tracto/i.test(c.tipo || "") || PAREJAS[c.pat] !== undefined;
const ST_PREV_TXT = {vencido:"preventivo vencido", proximo:"preventivo próximo", ok:"al día", sin:"sin plan"};
/** Texto de la pareja fija: "Semi 616 · 123.000 km · al día" (tracto <-> semi) */
function parInfo(c){
  if (!c || !c.par) return "";
  const q = parDe(c), rol = esTractoC(c) ? "Semi" : "Tracto";
  return q ? `${rol} ${q.pat} · ${fkm(q.km)} · ${ST_PREV_TXT[prev(q).st]}` : `${rol} ${c.par}`;
}
function setPar(c, nuevo){
  if ((c.par || "") === nuevo) return;
  const old = parDe(c); if (old && old.par === c.pat) old.par = "";
  if (nuevo){ const q = camion(nuevo); if (q){ const oq = parDe(q); if (oq && oq.par === q.pat) oq.par = ""; q.par = c.pat; c.par = nuevo; return; } }
  c.par = "";
}

const TIPOS_EQ = ["","Tractocamión","Semirremolque","Camión","Estanque","Camioneta"];
const ESTADOS_CAM = {operativo:["Operativo","green"], taller:["En taller","amber"], detenido:["Detenido","red"]};
const ESTADOS_OT = {abierta:["Abierta","blue"], proceso:["En proceso","amber"], revision:["En revisión","gray"], cerrada:["Cerrada","green"]};
const PRIO = ["Muy alta","Alta","Media","Baja"];
const PRIO_TAG = {"Muy alta":"red","Alta":"amber","Media":"blue","Baja":"gray"};
const SEV = ["Muy alta","Alta","Media","Baja"];

const otAbierta = o => o.estado !== "cerrada";
const otAtrasada = o => otAbierta(o) && o.vence && o.vence < hoy();

const pautaPorId = id => D.pautas.find(p => p.id === id);
/** Tareas (con intervalo en km) de todas las pautas asignadas al camión */
function tareasDe(c){
  const out = [];
  (c.pautaIds || []).forEach(pid => { const p = pautaPorId(pid); if (!p) return;
    const kms = p.tareas.map(t => t.cadaKm).filter(Boolean), min = kms.length ? Math.min(...kms) : null;
    p.tareas.forEach(t => out.push({key:pid+"/"+t.id, plan:p, tarea:t, primaria:!!t.cadaKm && t.cadaKm === min})); });
  return out;
}
function prev(c){
  const ts = tareasDe(c).filter(x => x.tarea.cadaKm);
  if (ts.length){
    const km = c.km || 0;
    const tareas = ts.map(x => {
      const last = (c.mant && c.mant[x.key]) || (x.primaria && c.ultKm != null ? {fecha:c.ultFecha, km:c.ultKm} : null);
      if (!last) return {...x, st:"sinreg", nk:null, kmR:null, last:null};
      const nk = last.km + x.tarea.cadaKm, kmR = nk - km;
      return {...x, last, nk, kmR, st: kmR <= 0 ? "vencido" : kmR <= 1000 ? "proximo" : "ok"};
    });
    const reg = tareas.filter(t => t.st !== "sinreg").sort((a,b) => a.kmR - b.kmR);
    const st = reg.some(t => t.st === "vencido") ? "vencido" : reg.some(t => t.st === "proximo") ? "proximo" : reg.length ? "ok" : "sin";
    return {nk:reg[0]?reg[0].nk:null, nd:null, kmR:reg[0]?reg[0].kmR:null, dR:null, st, tareas};
  }
  const cada = c.intKm;
  const nk = (c.ultKm != null && cada) ? c.ultKm + cada : null;
  const nd = (c.ultFecha && c.intDias) ? addDays(c.ultFecha, c.intDias) : null;
  const kmR = nk != null ? nk - (c.km || 0) : null;
  const dR = nd ? diff(hoy(), nd) : null;
  let st = "sin";
  if (nk != null || nd){
    if ((kmR != null && kmR <= 0) || (dR != null && dR < 0)) st = "vencido";
    else if ((kmR != null && kmR <= 1000) || (dR != null && dR <= 15)) st = "proximo";
    else st = "ok";
  }
  return {nk, nd, kmR, dR, st, tareas:[]};
}

const dlg = document.getElementById("dlg");
function form(title, fields, vals, onSave){
  dlg.innerHTML = `<form><h2>${esc(title)}</h2>${fields.map(f => {
    const v = vals[f.k] ?? f.def ?? "";
    if (f.t === "chk") return `<label class="chk"><input type="checkbox" name="${f.k}"${v?" checked":""}>${esc(f.l)}</label>`;
    let inp;
    if (f.t === "sel") inp = `<select name="${f.k}"${f.req?" required":""}>${f.opts.map(o => { const [val,lab] = Array.isArray(o)?o:[o,o]; return `<option value="${esc(val)}"${String(val)===String(v)?" selected":""}>${esc(lab)}</option>`; }).join("")}</select>`;
    else if (f.t === "area") inp = `<textarea name="${f.k}" rows="${f.rows||3}"${f.req?" required":""}>${esc(v)}</textarea>`;
    else inp = `<input name="${f.k}" type="${f.t||"text"}" value="${esc(v)}"${f.req?" required":""}${f.t==="number"?' step="any" min="0"':""}>`;
    return `<label>${esc(f.l)}${inp}</label>`;
  }).join("")}<div class="btns"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri">Guardar</button></div></form>`;
  const fm = dlg.querySelector("form");
  fm.querySelector("[data-x]").onclick = () => dlg.close();
  fm.onsubmit = e => {
    e.preventDefault();
    const out = {};
    fields.forEach(f => {
      const el = fm.elements[f.k];
      out[f.k] = f.t === "chk" ? el.checked : f.t === "number" ? num(el.value) : (el.value || "").trim();
    });
    onSave(out); save(); dlg.close(); render();
  };
  dlg.showModal();
}
const patOpts = () => D.camiones.length ? D.camiones.map(c => c.pat).sort() : [];
function needTrucks(){ if (!D.camiones.length){ alert("Primero agrega al menos un camión en la sección Camiones."); return true; } return false; }

function fCamion(c){
  const isNew = !c;
  form(isNew ? "Nuevo camión" : "Editar "+c.pat, [
    {k:"pat", l:"Patente", req:1},
    {k:"marca", l:"Marca / modelo"},
    {k:"base", l:"Base", t:"sel", opts:["","Puerto Montt","Chacabuco","Punta Arenas"]},
    {k:"tipo", l:"Tipo de equipo", t:"sel", opts:TIPOS_EQ},
    {k:"par", l:"Pareja fija (tracto ↔ semirremolque)", t:"sel", opts:["", ...D.camiones.filter(k => !c || k.pat !== c.pat).map(k => k.pat).sort()]},
    {k:"km", l:"Kilometraje actual", t:"number"},
    {k:"estado", l:"Estado", t:"sel", opts:Object.entries(ESTADOS_CAM).map(([k,v])=>[k,v[0]]), def:"operativo"},
    {k:"ultFecha", l:"Fecha última mantención", t:"date"},
    {k:"ultKm", l:"Km última mantención", t:"number"},
    {k:"intKm", l:"Mantener cada (km)", t:"number", def:10000},
    {k:"intDias", l:"Mantener cada (días)", t:"number", def:90},
  ], c || {}, v => {
    v.pat = v.pat.toUpperCase().replace(/\s+/g,"");
    const nuevaPar = v.par || ""; delete v.par;
    if (isNew){ if (camion(v.pat)){ alert("Esa patente ya existe."); return; } D.camiones.push(v); setPar(v, nuevaPar); }
    else { if (v.pat !== c.pat){ if (camion(v.pat)){ alert("Esa patente ya existe."); return; }
        [...D.ots, ...D.fallas, ...D.gastos].forEach(r => { if (r.pat === c.pat) r.pat = v.pat; });
        D.camiones.forEach(k => { if (k.par === c.pat) k.par = v.pat; }); }
      const kmAnt = c.km;
      Object.assign(c, v);
      /* el km del semi sigue al del tracto */
      if (esTractoC(c) && kmAnt != null && c.km != null && c.km > kmAnt){ const q = parDe(c); if (q && q.km != null){ q.km += c.km - kmAnt; q.kmFecha = hoy(); } }
      setPar(c, nuevaPar); }
  });
}
function fOT(o, pre){
  if (needTrucks()) return; const isNew = !o;
  form(isNew ? "Nueva orden de trabajo" : "Orden #"+o.id, [
    {k:"pat", l:"Camión", t:"sel", opts:patOpts(), req:1},
    {k:"tipo", l:"Tipo", t:"sel", opts:[["preventivo","Preventivo (planificada)"],["correctivo","Correctivo (no planificada)"]]},
    {k:"desc", l:"Descripción", t:"area", req:1},
    {k:"prioridad", l:"Prioridad", t:"sel", opts:PRIO, def:"Media"},
    {k:"resp", l:"Responsable / taller"},
    {k:"estado", l:"Estado", t:"sel", opts:Object.entries(ESTADOS_OT).map(([k,v])=>[k,v[0]]), def:"abierta"},
    {k:"creada", l:"Fecha de creación", t:"date", def:hoy()},
    {k:"vence", l:"Fecha comprometida", t:"date"},
    {k:"costo", l:"Costo (CLP)", t:"number"},
  ], o || pre || {}, v => {
    if (v.estado === "cerrada") v.cerrada = (o && o.cerrada) || hoy(); else v.cerrada = null;
    const abria = !isNew && otAbierta(o);
    if (isNew) D.ots.push({id:nid(), ...v}); else Object.assign(o, v);
    if (abria && v.estado === "cerrada") alCerrar(o);
  });
}
function fFalla(f){
  if (needTrucks()) return; const isNew = !f;
  form(isNew ? "Reportar falla" : "Falla #"+f.id, [
    {k:"fecha", l:"Fecha", t:"date", def:hoy(), req:1},
    {k:"pat", l:"Camión", t:"sel", opts:(f && f.pat && !camion(f.pat)) ? [f.pat, ...patOpts()] : patOpts(), req:1},
    {k:"desc", l:"Qué ocurrió", t:"area", req:1},
    {k:"severidad", l:"Severidad", t:"sel", opts:SEV, def:"Media"},
    {k:"reportado", l:"Reportado por"},
    {k:"solucion", l:"Solución aplicada (si ya se resolvió)", t:"area"},
    ...(isNew ? [{k:"crearOT", l:"Crear orden de trabajo correctiva", t:"chk", def:true}] : []),
  ], f || {}, v => {
    const crear = v.crearOT; delete v.crearOT;
    if (isNew){
      const id = nid(); const rec = {id, ...v};
      if (crear){ const oid = nid(); D.ots.push({id:oid, pat:v.pat, tipo:"correctivo", desc:"Falla: "+v.desc, prioridad:v.severidad, resp:"", estado:v.solucion?"cerrada":"abierta", creada:v.fecha, vence:addDays(v.fecha,3), cerrada:v.solucion?v.fecha:null, costo:null}); rec.otId = oid; }
      D.fallas.push(rec);

}
function fGasto(g){
  if (needTrucks()) return; const isNew = !g;
  form(isNew ? "Nuevo gasto" : "Editar gasto", [
    {k:"fecha", l:"Fecha", t:"date", def:hoy(), req:1},
    {k:"pat", l:"Camión", t:"sel", opts:patOpts(), req:1},
    {k:"concepto", l:"Concepto (repuesto, servicio…)", req:1},
    {k:"monto", l:"Monto (CLP)", t:"number", req:1},
  ], g || {}, v => { if (isNew) D.gastos.push({id:nid(), ...v}); else Object.assign(g, v); });
}
function fHecha(c){
  const ts = tareasDe(c).filter(x => x.tarea.cadaKm);
  form("Mantención realizada · "+c.pat, [
    ...(ts.length ? [{k:"tarea", l:"Qué mantención se hizo", t:"sel", opts:[["","General"], ...ts.map(x => [x.key, `${x.tarea.nombre} (${x.plan.nombre.replace(/^FLOTA\s*-\s*(PLAN|PAUTA)\s+(DE\s+)?MANTEN[A-Z]+\s+/i,"")})`])]}] : []),
    {k:"fecha", l:"Fecha", t:"date", def:hoy(), req:1},
    {k:"km", l:"Kilometraje al hacerla", t:"number", def:c.km},
    {k:"resp", l:"Taller / responsable"},
    {k:"costo", l:"Costo (CLP)", t:"number"},
  ], {}, v => {
    if (v.tarea){ c.mant = c.mant || {}; c.mant[v.tarea] = {fecha:v.fecha, km:v.km != null ? v.km : (c.km||0)}; }
    else { c.ultFecha = v.fecha; if (v.km != null) c.ultKm = v.km; }
    if (v.km != null && v.km > (c.km||0)) c.km = v.km;
    if (c.estado === "taller") c.estado = "operativo";
    const t = ts.find(x => x.key === v.tarea);
    D.ots.push({id:nid(), pat:c.pat, tipo:"preventivo", desc:t ? t.tarea.nombre : "Mantención preventiva", prioridad:"Media", resp:v.resp, estado:"cerrada", creada:v.fecha, vence:v.fecha, cerrada:v.fecha, costo:v.costo});
  });
}

const tag = (txt, cls) => `<span class="tag ${cls}">${esc(txt)}</span>`;
const emptyMsg = (txt, btn) => `<div class="empty">${txt}${btn||""}</div>`;
const demoBtns = `<br><button class="btn pri" data-act="demo">Cargar datos de ejemplo</button>`;

function vResumen(){
  if (!D.camiones.length) return emptyMsg("Aún no hay datos. Agrega tus camiones en <b>Camiones</b> o prueba el tablero con datos de ejemplo.",
    `<br><button class="btn pri" data-act="go-camiones">Agregar camiones</button><button class="btn" data-act="demo">Cargar datos de ejemplo</button>`);
  const h = hoy(), d30 = addDays(h,-30);
  const det = D.camiones.filter(c => c.estado !== "operativo");
  const abiertas = D.ots.filter(otAbierta), atras = D.ots.filter(otAtrasada);
  const rec = D.ots.filter(o => o.creada >= d30);
  const cerr = rec.filter(o => o.estado === "cerrada").length;
  const cumpl = rec.length ? Math.round(cerr*1000/rec.length)/10 : null;
  const plan = rec.filter(o => o.tipo === "preventivo").length, noPlan = rec.length - plan;
  const pv = D.camiones.map(c => ({c, p:prev(c)})).filter(x => x.p.st === "vencido");
  const pp = D.camiones.map(c => ({c, p:prev(c)})).filter(x => x.p.st === "proximo");
  const mes = h.slice(0,7);
  const gasto = D.gastos.filter(g => g.fecha.startsWith(mes)).reduce((a,g)=>a+(g.monto||0),0) + D.ots.filter(o => o.cerrada && o.cerrada.startsWith(mes)).reduce((a,o)=>a+(o.costo||0),0);
  const pr = PRIO.map(p => [p, abiertas.filter(o => o.prioridad === p).length]); const mx = Math.max(1, ...pr.map(x=>x[1]));
  const pPlan = rec.length ? Math.round(plan*100/rec.length) : 0;

  const nuevasObs = D.fallas.filter(x => x.nueva && !x.otId);
  const alertas = [
    ...nuevasObs.map(x => `<li>${tag("Observación nueva","blue")} <b>${esc(x.pat)}</b> · ${esc(x.desc)} ${x.opera==="No"?tag("No puede operar","red"):""} <button class="btn sm" data-act="go" data-tab="fallas">Ver</button></li>`),

const itemsToText = its => { let g = null, out = []; its.forEach(i => { if ((i.grupo||null) !== g){ g = i.grupo||null; if (g) out.push("## "+g); } out.push([i.sis, i.desc].concat(i.tipo !== "apf" || i.it ? [i.tipo||"apf", i.it ? i.it.join(",") : ""] : []).join(" | ").replace(/ \| $/, "")); }); return out.join("\n"); };
const textToItems = t => { let g = null; const out = []; t.split("\n").map(l => l.trim()).filter(Boolean).forEach(l => {
  if (l.startsWith("##")){ g = l.replace(/^#+\s*/,"") || null; return; }
  const [sis, desc, tp, iters] = l.split("|").map(s => s.trim());
  const tl = (tp||"").toLowerCase();
  const it = {sis:sis||"", desc:desc||sis||"", tipo: tl==="sino" ? "sino" : tl==="texto" ? "texto" : "apf"};
  const nums = (iters||"").split(/[,\s]+/).map(x => parseInt(x,10)).filter(x => x > 0); if (nums.length) it.it = nums;
  if (g) it.grupo = g; out.push(it); }); return out; };

/** Editor de un plan: nombre, tipo, equipos y tareas (cada una con su intervalo y checklist) */
function fPlan(p){
  const isNew = !p;
  const d = isNew ? {id:"p-"+nid(), nombre:"", tipo:"", tareas:[], activos:[]} : JSON.parse(JSON.stringify(p));
  let equipos = D.camiones.filter(c => (c.pautaIds||[]).includes(d.id)).map(c => c.pat).join(", ");
  const pie = (txt) => dlg.querySelector("#plan-msg").textContent = txt || "";
  const vistaPlan = () => {
    dlg.style.width = "min(760px,96vw)";
    dlg.innerHTML = `<form><h2>${isNew?"Nuevo plan":"Editar plan"}</h2>
      <label>Nombre<input name="nombre" value="${esc(d.nombre)}" required></label>
      <label>Aplica a<select name="tipo">${TIPOS_EQ.map(t => `<option value="${esc(t)}"${d.tipo===t?" selected":""}>${t||"—"}</option>`).join("")}</select></label>
      <label>Equipos que usan este plan (números separados por coma)<textarea name="equipos" rows="2">${esc(equipos)}</textarea></label>
      <div class="sec" style="margin-top:4px">Tareas</div>
      <div style="border:1px solid var(--line);border-radius:10px;margin-bottom:10px">${d.tareas.length ? d.tareas.map((t,i) => `<div style="display:flex;gap:8px;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line)"><div><b>${esc(t.nombre)}</b><div class="sub">${t.cadaKm?`Cada ${Number(t.cadaKm).toLocaleString("es-CL")} km`:"Sin intervalo (manual)"} · ${t.items.length} ítems</div></div><div style="display:flex;gap:6px"><button type="button" class="btn sm" data-t="${i}">Editar</button><button type="button" class="btn sm danger" data-d="${i}">Quitar</button></div></div>`).join("") : `<div class="sub" style="padding:10px 12px">Sin tareas.</div>`}</div>
      <button type="button" class="btn sm" data-nt>+ Nueva tarea</button>
      <div id="plan-msg" style="color:var(--red);margin-top:8px"></div>
      <div class="btns"><button type="button" class="btn" data-x>Cancelar</button><button class="btn pri">Guardar plan</button></div></form>`;
    const fm = dlg.querySelector("form");
    const leer = () => { d.nombre = fm.elements.nombre.value.trim(); d.tipo = fm.elements.tipo.value; equipos = fm.elements.equipos.value; };
    fm.querySelector("[data-x]").onclick = () => dlg.close();
    fm.querySelector("[data-nt]").onclick = () => { leer(); vistaTarea(null); };
    fm.querySelectorAll("[data-t]").forEach(b => b.onclick = () => { leer(); vistaTarea(+b.dataset.t); });
    fm.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { leer(); const t = d.tareas[+b.dataset.d]; if (confirm(`¿Quitar la tarea "${t.nombre}"?`)){ d.tareas.splice(+b.dataset.d, 1); vistaPlan(); } else vistaPlan(); });
    fm.onsubmit = e => { e.preventDefault(); leer();
      if (!d.nombre){ pie("Falta el nombre."); return; }
      const pats = [...new Set(equipos.split(/[,;\s]+/).map(x => normId(x)).filter(Boolean))];
      const faltan = pats.filter(x => !camion(x));
      if (faltan.length && !confirm(`${faltan.length} equipos no existen aún en el tablero (${faltan.slice(0,8).join(", ")}${faltan.length>8?"…":""}). ¿Crearlos?`)) return;
      faltan.forEach(x => D.camiones.push({pat:x, marca:"", base:"", tipo:d.tipo==="Estanque"?"":d.tipo, km:null, estado:"operativo", intKm:10000, intDias:90, pautaIds:[], mant:{}}));
      D.camiones.forEach(c => { c.pautaIds = (c.pautaIds||[]).filter(id => id !== d.id); if (pats.includes(c.pat)) c.pautaIds.push(d.id); });
      if (isNew) D.pautas.push(d); else Object.assign(p, d);
      save(); dlg.close(); render(); };
  };
  const vistaTarea = (idx) => {
    const t = idx == null ? {id:"t"+(Math.max(0, ...d.tareas.map(x => +String(x.id).slice(1)||0)) + 1), nombre:"", cadaKm:null, items:[]} : d.tareas[idx];
    dlg.innerHTML = `<form><h2>${idx==null?"Nueva tarea":"Tarea"}</h2>

/** Asigna a cada camión los planes según la lista de activos vinculados que trae Fracttal */
function asignarFracttal(){
  const faltan = new Set();
  D.pautas.forEach(p => (p.activos||[]).forEach(id => { if (!camion(id)) faltan.add(id); }));
  let crear = false;
  if (faltan.size) crear = confirm(`${faltan.size} equipos de Fracttal no están en el tablero. ¿Crearlos (sin km hasta que los ingreses)?`);
  let n = 0;
  D.pautas.forEach(p => (p.activos||[]).forEach(id => {
    let c = camion(id);
    if (!c && crear){ c = {pat:id, marca:"", base:"", tipo:(p.tipo==="Estanque"?"":p.tipo), km:null, estado:"operativo", intKm:10000, intDias:90, pautaIds:[], mant:{}}; D.camiones.push(c); }
    if (!c) return;
    c.pautaIds = c.pautaIds || [];
    if (!c.pautaIds.includes(p.id)){ c.pautaIds.push(p.id); n++; }
    if (!c.tipo && p.tipo && p.tipo !== "Estanque") c.tipo = p.tipo;
  }));
  save(); render(); alert(`${n} asignaciones de planes aplicadas.`);
}
const RES = t => t==="sino" ? [["si","Sí"],["no","No"],["na","N/A"]] : [["apf","Aprobó"],["alerta","Alerta"],["fallo","Falló"]];
const grupoDe = (p, t) => `${p.nombre.replace(/^FLOTA\s*-?\s*(PLAN|PAUTA)\s+(DE\s+)?MANTEN[A-Z]+\s+/i,"")} · ${t.nombre}`;
/** Las tareas cíclicas de Fracttal marcan en qué ciclos aplica cada ítem (ciclo n = n × cada km) */
function itemsPara(t){
  const its = t.tarea.items, maxIt = Math.max(0, ...its.flatMap(i => i.it || []));
  if (!maxIt || !t.tarea.cadaKm || t.nk == null) return its;
  const n = Math.max(1, Math.round(t.nk / t.tarea.cadaKm)), nn = ((n - 1) % maxIt) + 1;
  return its.filter(i => !i.it || i.it.includes(nn));
}
/** Crea la OT preventiva de un equipo con SU pauta. porTracto: el semi se arrastra aunque aun no le toque por su propio km. */
function crearOT(c, porTracto){
  const pv = prev(c);
  let due = pv.tareas.filter(t => t.st === "vencido" || t.st === "proximo");
  if (!due.length && porTracto){
    const r = pv.tareas.filter(t => t.st !== "sinreg").sort((x,y) => x.kmR - y.kmR)[0] || pv.tareas.find(t => t.primaria) || pv.tareas[0];
    if (r) due = [r];
    else { alert(`${c.pat} no tiene una pauta asignada: asígnala en Pautas para generar su OT.`); return false; }
  }
  if (!due.length) return false;
  const keys = due.map(t => t.key);
  const ya = D.ots.find(o => o.pat === c.pat && otAbierta(o) && (o.keys||[]).some(k => keys.includes(k)));
  if (ya){ alert(`Ya hay una OT abierta con alguna de estas tareas para ${c.pat} (OT #${ya.id}).`); return false; }
  const items = [];
  due.forEach(t => { const g = grupoDe(t.plan, t.tarea);
    const its = itemsPara(t);
    if (its.length) its.forEach(i => items.push({grupo:g, sis:i.sis, desc:i.desc, tipo:i.tipo, res:null}));
    else items.push({grupo:g, sis:"GENERAL", desc:"Realizar "+t.tarea.nombre+" (checklist aún no cargado en el plan)", tipo:"sino", res:null}); });
  const q = parDe(c);
  const id = nid();
  D.ots.push({id, pat:c.pat, tipo:"preventivo", desc:due.map(t => t.tarea.nombre).join(" + "), prioridad:due.some(t => t.st==="vencido") ? "Alta" : "Media", resp:"", estado:"abierta", creada:hoy(), vence:addDays(hoy(),3), cerrada:null, costo:null, keys, kmOT:c.km, notas: porTracto && q ? `Arrastrada por la mantención del tracto ${q.pat}` : "", items});
  return true;
}

}

    o.estado = "cerrada"; o.cerrada = hoy(); alCerrar(o); save(); render(); }
  else if (a === "checklist") fChecklist(byId(D.ots, id));
  else if (a === "gen-ot") genOT(camion(id));
  else if (a === "gen-ot-arr"){ if (crearOT(camion(id), true)){ save(); S.f.ots = "abiertas"; go("ots"); } }
  else if (a === "new-pauta") fPlan();
  else if (a === "edit-pauta") fPlan(D.pautas.find(p => p.id === id));
  else if (a === "ft-asignar") asignarFracttal();
  else if (a === "um-imp") document.getElementById("um").click();
  else if (a === "um-apply") aplicarUM();
  else if (a === "del-pauta"){ if (confirm("¿Eliminar esta pauta? Los camiones que la usan quedan sin pauta.")){ D.pautas = D.pautas.filter(p => p.id !== id); D.camiones.forEach(c => { c.pautaIds = (c.pautaIds||[]).filter(x => x !== id); }); save(); render(); } }
  else if (a === "del-ot"){ if (confirm("¿Eliminar esta orden de trabajo?")){ D.ots = D.ots.filter(o => String(o.id) !== id); save(); render(); } }
  else if (a === "new-falla") fFalla();
  else if (a === "edit-falla") fFalla(byId(D.fallas, id));
  else if (a === "del-falla"){ if (confirm("¿Eliminar esta falla?")){ D.fallas = D.fallas.filter(x => String(x.id) !== id); save(); render(); } }
  else if (a === "new-gasto") fGasto();
  else if (a === "edit-gasto") fGasto(byId(D.gastos, id));
  else if (a === "del-gasto"){ if (confirm("¿Eliminar este gasto?")){ D.gastos = D.gastos.filter(g => String(g.id) !== id); save(); render(); } }
  else if (a === "sync") sincronizar();
  else if (a === "sync-cfg") fSync();
  else if (a === "falla-ot"){ const x = byId(D.fallas, id); const oid = nid();
    D.ots.push({id:oid, pat:x.pat, tipo:"correctivo", desc:"Falla: "+x.desc, prioridad:SEV.includes(x.severidad)?x.severidad:"Media", resp:"", estado:"abierta", creada:hoy(), vence:addDays(hoy(), x.opera==="No"?1:3), cerrada:null, costo:null});
    x.otId = oid; x.nueva = false; save(); render(); }
  else if (a === "clave") fClave();
  else if (a === "salir") salir();
  else if (a === "demo") demo();
  else if (a === "export") exportar();
  else if (a === "import") document.getElementById("file").click();
});
document.getElementById("q").addEventListener("input", e => { S.q = e.target.value; render(); });
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const s = JSON.parse(r.result); if (!s.camiones) throw 0; if (confirm("Esto reemplaza los datos actuales. ¿Continuar?")){ D = Object.assign(EMPTY(), s); ESTADO_ANT = null; save(); render(); } }catch(_){ alert("Archivo de respaldo no válido."); } };
  r.readAsText(f); e.target.value = "";
});
/* ===== Observaciones de conductores: se leen directo del servidor ===== */
function syncCfg(){ return {url:true}; }
function fSync(){}
function sincronizar(){
  google.script.run
    .withSuccessHandler(j => {
      const conocidos = new Set(D.fallas.map(f => f.ext).filter(Boolean)); let n = 0;
      j.items.forEach(it => { if (conocidos.has(it.id)) return;
        const pat = normId(it.equipo) || it.equipo;
        D.fallas.push({id:nid(), ext:it.id, fecha:(it.fecha||"").slice(0,10) || hoy(), pat, desc:it.desc, severidad:SEV.includes(it.severidad)?it.severidad:"Media", reportado:it.conductor, solucion:"", opera:it.opera, nueva:true});
        const cam = camion(pat); if (cam && it.km != null && it.km > (cam.km||0)){ cam.km = it.km; cam.kmFecha = (it.fecha||"").slice(0,10) || hoy(); }
        if (cam && it.opera === "No" && cam.estado === "operativo") cam.estado = "detenido";
        n++; });
      save(); S.tab = "fallas"; render();
      alert(n ? `${n} observaciones nuevas de conductores.` : "Sin observaciones nuevas.");
    })
    .withFailureHandler(e => alert("No pude leer las observaciones: "+(e && e.message ? e.message : e)))
    .leerObservaciones(TOKEN);
}

/* ===== Importar últimas mantenciones (archivo fracttal_ultimas_mantenciones.json) ===== */
let UM = null;
const normTarea = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\bKMS?\b/g,"").replace(/\s+/g," ").trim();
document.getElementById("um").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try{ leerUM(JSON.parse(r.result)); }catch(err){ alert("Archivo no válido: "+err.message); } };
  r.readAsText(f);
});
function leerUM(j){
  if (!j || !Array.isArray(j.items)) throw new Error("falta la lista items");
  const ok = [], sinEq = [], sinPlan = [], viejos = [];
  j.items.forEach(it => {
    const id = normId(it.equipo); let c = camion(id), esNuevo = false;
    if (!c){ c = {pat:id, pautaIds:[], mant:{}}; esNuevo = true; }
    const nt = normTarea(it.tarea);
    const buscar = ids => { for (const pid of ids){ const p = pautaPorId(pid); if (!p) continue; const t = p.tareas.find(x => normTarea(x.nombre) === nt); if (t) return {p, t}; } return null; };
    let hit = buscar(c.pautaIds || []), nuevoPlan = false;
    if (!hit){ const cand = D.pautas.filter(p => p.tareas.some(x => normTarea(x.nombre) === nt));
      if (cand.length === 1){ hit = buscar([cand[0].id]); nuevoPlan = true; } }
    if (!hit){ sinPlan.push(id+" ("+it.tarea+")"); return; }
    const key = hit.p.id + "/" + hit.t.id, prevR = c.mant && c.mant[key];
    if (prevR && prevR.fecha >= it.fecha){ viejos.push(id); return; }
    ok.push({id, key, plan:hit.p, tarea:hit.t, fecha:it.fecha, km:it.km, actual:it.medidorActual, nuevoPlan, esNuevo});
  });
  UM = {ok, leido:j.leido};
  const L = (arr, fn, max=10) => arr.length ? `<ul style="margin:4px 0 10px;padding-left:18px;font-size:13px">${arr.slice(0,max).map(fn).join("")}${arr.length>max?`<li>… y ${arr.length-max} más</li>`:""}</ul>` : "";
  dlg.innerHTML = `<form><h2>Importar últimas mantenciones</h2>
    <div class="sub" style="margin-bottom:8px">${j.items.length} registros del archivo${j.leido?` (leído el ${esc(j.leido)})`:""}. El km es el del odómetro cuando Fracttal activó la tarea, una aproximación de la última mantención.</div>
    <div><b>${ok.length}</b> mantenciones por registrar${L(ok, x => `<li>${esc(x.id)}: ${esc(x.tarea.nombre)} · ${fkm(x.km)} · ${fdate(x.fecha)}${x.nuevoPlan?" · se asigna el plan":""}${x.esNuevo?" · equipo nuevo":""}</li>`)}</div>
    ${sinEq.length?`<div class="sub"><b>${sinEq.length}</b> equipos del archivo no están en el tablero: ${esc([...new Set(sinEq)].slice(0,12).join(", "))}${sinEq.length>12?"…":""}</div>`:""}
    ${sinPlan.length?`<div class="sub"><b>${sinPlan.length}</b> sin plan que coincida (asígnales su plan en Pautas): ${esc(sinPlan.slice(0,6).join("; "))}${sinPlan.length>6?"…":""}</div>`:""}
    ${viejos.length?`<div class="sub">${viejos.length} ya tenían una mantención igual o más reciente y no se cambian.</div>`:""}
    <div class="btns"><button type="button" class="btn" data-x>Cancelar</button><button type="button" class="btn pri" data-act="um-apply"${ok.length?"":" disabled"}>Aplicar</button></div></form>`;
  dlg.querySelector("[data-x]").onclick = () => dlg.close(); dlg.showModal();
}
function aplicarUM(){
  if (!UM) return;
  UM.ok.forEach(x => { let c = camion(x.id);
    if (!c){ c = {pat:x.id, marca:"", base:"", tipo:/RAMPLA/i.test(x.tarea.nombre) ? "Semirremolque" : "", km:null, estado:"operativo", intKm:10000, intDias:90, pautaIds:[], mant:{}}; D.camiones.push(c); }
    c.mant = c.mant || {};
    if (x.nuevoPlan && !(c.pautaIds||[]).includes(x.plan.id)){ c.pautaIds = c.pautaIds || []; c.pautaIds.push(x.plan.id); }
    c.mant[x.key] = {fecha:x.fecha, km:x.km};
    if (x.actual && x.actual > (c.km || 0)){ c.km = x.actual; c.kmFecha = UM.leido || hoy(); } });
  const n = UM.ok.length; UM = null; save(); dlg.close(); render(); alert(n + " mantenciones registradas.");
}

const normId = v => { if (v == null || v === "") return null; const s = String(v).trim(); return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s,10)) : s.toUpperCase(); };

function exportar(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 1)], {type:"application/json"}));
  a.download = `respaldo_mantenimiento_${hoy()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    {pat:"DEMO03", marca:"Camión de ejemplo C", km:55300, estado:"operativo", ultFecha:d(-80), ultKm:46000, intKm:10000, intDias:90},
    {pat:"DEMO04", marca:"Camión de ejemplo D", km:210100, estado:"detenido", ultFecha:d(-20), ultKm:205000, intKm:10000, intDias:90},
    {pat:"DEMO05", marca:"Camión de ejemplo E", km:12000, estado:"operativo", ultFecha:d(-10), ultKm:10000, intKm:10000, intDias:90});
  const ot = (pat,tipo,desc,prioridad,estado,c,v,costo) => D.ots.push({id:nid(), pat, tipo, desc, prioridad, resp:"Taller ejemplo", estado, creada:d(c), vence:d(v), cerrada:estado==="cerrada"?d(v):null, costo});
  ot("DEMO02","correctivo","Cambio de embrague","Alta","proceso",-3,2,null);
  ot("DEMO04","correctivo","Falla de frenos","Muy alta","abierta",-6,-2,null);

  ot("DEMO05","preventivo","Revisión inicial","Baja","cerrada",-10,-10,90000);
  ot("DEMO03","correctivo","Cambio de neumático","Media","cerrada",-12,-11,240000);
  ot("DEMO01","preventivo","Mantención 170.000 km","Media","cerrada",-95,-95,320000);
  D.fallas.push({id:nid(), fecha:d(-6), pat:"DEMO04", desc:"Pérdida de presión de frenos en ruta", severidad:"Muy alta", reportado:"Conductor", solucion:""},
                {id:nid(), fecha:d(-12), pat:"DEMO03", desc:"Neumático reventado", severidad:"Media", reportado:"Conductor", solucion:"Cambio de neumático"});
  D.gastos.push({id:nid(), fecha:d(-5), pat:"DEMO02", concepto:"Kit de embrague", monto:410000}, {id:nid(), fecha:d(-2), pat:"DEMO04", concepto:"Cañerías de freno", monto:95000});
  save(); render();
}
