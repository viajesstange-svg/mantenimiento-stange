<script>
/* Comunicación con el servidor (Apps Script) por fetch, igual que la app de registro de viajes.
   Mantiene la forma google.script.run.withSuccessHandler(...).withFailureHandler(...).funcion(args). */
const API_URL = "https://script.google.com/macros/s/AKfycbz9-miexOJHOrgyTcb_KDHlUgGjPS2T0HFTzqXpswygxTczqLLJgrdCkPGmj49sFDQxNQ/exec";
window.google = { script: { get run(){
  let ok = () => {}, fail = () => {};
  const p = new Proxy({}, { get(_, nombre){
    if (nombre === "withSuccessHandler") return f => { ok = f; return p; };
    if (nombre === "withFailureHandler") return f => { fail = f; return p; };
    return (...args) => {
      fetch(API_URL, { method: "POST", body: JSON.stringify({ accion: nombre, args }) })
        .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
        .then(j => { if (j && j.ok) ok(j.valor); else fail(new Error((j && j.error) || "Error del servidor")); })
        .catch(e => fail(new Error(/Failed to fetch|NetworkError|Load failed/i.test(String(e && e.message)) ? "Sin conexión con el servidor" : (e && e.message) || "Error")));
    };
  } });
  return p;
} } };
</script>

const pautaPorId = id => D.pautas.find(p => p.id === id);
/** Tareas (con intervalo en km) de todas las pautas asignadas al camión */
function tareasDe(c){
  const out = [];
  (c.pautaIds || []).forEach(pid => { const p = pautaPorId(pid); if (!p) return;
    const kms = p.tareas.map(t => t.cadaKm).filter(Boolean), min = kms.length ? Math.min(...kms) : null;
    p.tareas.forEach(t => out.push({key:pid+"/"+t.id, plan:p, tarea:t, primaria:!!t.cadaKm && t.cadaKm === min})); });
  return out;
}
function prev(c){
  const ts = tareasDe(c).filter(x => x.tarea.cadaKm);
  if (ts.length){
    const km = c.km || 0;
    const tareas = ts.map(x => {
      const last = (c.mant && c.mant[x.key]) || (x.primaria && c.ultKm != null ? {fecha:c.ultFecha, km:c.ultKm} : null);
      if (!last) return {...x, st:"sinreg", nk:null, kmR:null, last:null};
      const nk = last.km + x.tarea.cadaKm, kmR = nk - km;
      return {...x, last, nk, kmR, st: kmR <= 0 ? "vencido" : kmR <= 1000 ? "proximo" : "ok"};
    });
    const reg = tareas.filter(t => t.st !== "sinreg").sort((a,b) => a.kmR - b.kmR);
    const st = reg.some(t => t.st === "vencido") ? "vencido" : reg.some(t => t.st === "proximo") ? "proximo" : reg.length ? "ok" : "sin";
    return {nk:reg[0]?reg[0].nk:null, nd:null, kmR:reg[0]?reg[0].kmR:null, dR:null, st, tareas};
  }
  const cada = c.intKm;
  const nk = (c.ultKm != null && cada) ? c.ultKm + cada : null;
  const nd = (c.ultFecha && c.intDias) ? addDays(c.ultFecha, c.intDias) : null;
  const kmR = nk != null ? nk - (c.km || 0) : null;
  const dR = nd ? diff(hoy(), nd) : null;
  let st = "sin";
  if (nk != null || nd){
    if ((kmR != null && kmR <= 0) || (dR != null && dR < 0)) st = "vencido";
    else if ((kmR != null && kmR <= 1000) || (dR != null && dR <= 15)) st = "proximo";
    else st = "ok";
  }
  return {nk, nd, kmR, dR, st, tareas:[]};
}

function fCamion(c){
  const isNew = !c;
  form(isNew ? "Nuevo camión" : "Editar "+c.pat, [
    {k:"pat", l:"Patente", req:1},
    {k:"marca", l:"Marca / modelo"},
    {k:"base", l:"Base", t:"sel", opts:["", ...new Set([...BASES_FLOTA, ...D.camiones.map(k => k.base).filter(Boolean)])]},
    {k:"tipo", l:"Tipo de equipo", t:"sel", opts:TIPOS_EQ},
    {k:"par", l:"Pareja fija (tracto ↔ semirremolque)", t:"sel", opts:["", ...D.camiones.filter(k => !c || k.pat !== c.pat).map(k => k.pat).sort()]},

    {k:"estado", l:"Estado", t:"sel", opts:Object.entries(ESTADOS_CAM).map(([k,v])=>[k,v[0]]), def:"operativo"},
    {k:"ultFecha", l:"Fecha última mantención", t:"date"},

    {k:"intKm", l:"Mantener cada (km)", t:"number", def:10000},
    {k:"intDias", l:"Mantener cada (días)", t:"number", def:90},
  ], c || {}, v => {

    if (isNew){ if (camion(v.pat)){ alert("Esa patente ya existe."); return; } D.camiones.push(v); setPar(v, nuevaPar); }
    else { if (v.pat !== c.pat){ if (camion(v.pat)){ alert("Esa patente ya existe."); return; }
        [...D.ots, ...D.fallas, ...D.gastos].forEach(r => { if (r.pat === c.pat) r.pat = v.pat; });

function animarNumeros(raiz){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  raiz.querySelectorAll("[data-count]").forEach(el => {
    const fin = parseFloat(el.dataset.count), dec = +(el.dataset.dec || 0), suf = el.dataset.suf || ""; if (!isFinite(fin)) return;
    const fmt = v => (dec ? v.toFixed(dec).replace(".", ",") : Math.round(v).toLocaleString("es-CL")) + suf, t0 = performance.now(), dur = 1000;
    const paso = t => { const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(fin * e); if (k < 1) requestAnimationFrame(paso); else el.textContent = fmt(fin); };
    el.textContent = fmt(0); requestAnimationFrame(paso); });
}
function entradaVista(v){

}

  if (D.kmAuto) h = `<div class="sub" style="margin-bottom:8px">Km actualizados automáticamente desde la planilla de viajes el ${fdate(D.kmAuto.fecha)}${D.kmAuto.hora?" "+esc(D.kmAuto.hora):""} · ${D.kmAuto.actualizados} equipos${D.kmAuto.nuevos?` · ${D.kmAuto.nuevos} equipos nuevos`:""}</div>` + h;
  if (!all.length) return h + emptyMsg("Sin camiones registrados.", demoBtns);

  return h + orden.map(c => {

/* ===== Detalle de tareas: tablero por columnas (pendientes, en proceso, en revisión, finalizadas) ===== */
function vTareas(){
  const f = S.f.tareas, q = S.q.trim();
  const all = D.camiones.map(c => ({c, p:prev(c)}));
  const cumple = st => f === "vencido" ? st === "vencido" : f === "proximo" ? st === "proximo" : (st === "vencido" || st === "proximo");
  const stPar = c => { const x = parDe(c); return x ? prev(x).st : null; };
  const raices = all.filter(x => esRaiz(x.c) && cumple(x.p.st) && (match(x.c.pat, x.c.marca) || (q && x.c.par && match(x.c.par))));
  const ord = {vencido:0, proximo:1, ok:2, sin:3}, grupos = [];
  raices.sort((a,b) => ord[a.p.st]-ord[b.p.st] || (a.p.kmR??1e9)-(b.p.kmR??1e9)).forEach(x => {
    grupos.push(x); const sm = parDe(x.c); if (sm && esTractoC(x.c) && !esTractoC(sm)) grupos.push({c:sm, p:prev(sm)}); });
  const corto = n => n.replace(/^MANTENIMIENTO PROGRAMADO\s*/i,"Programado ").replace(/^MANTENCIÓN\s*/i,"");
  const lbl = {vencido:["Vencido","red"],proximo:["Próximo","amber"],ok:["Al día","green"],sin:["Sin plan","gray"]};
  const cardPrev = ({c,p}) => {
    const trq = parDe(c), due = p.tareas.filter(t => t.st === "vencido" || t.st === "proximo");

  const barra = S.sel.size ? `<div class="chips" style="justify-content:space-between;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)"><b>${S.sel.size} equipo${S.sel.size===1?"":"s"} seleccionado${S.sel.size===1?"":"s"}: ${esc([...S.sel].join(" + "))}</b><span style="display:flex;gap:8px"><button class="btn pri" data-act="gen-sel">Generar una sola OT</button><button class="btn" data-act="sel-clear">Limpiar</button></span></div>` : "";
  const h = `<div class="stk"><div class="chips" style="justify-content:space-between;margin-bottom:6px"><span style="display:flex;gap:8px;flex-wrap:wrap">${[["todo","Todo"],["atrasadas","OTs atrasadas"],["vencido","Vencidos"],["proximo","Próximos"]].map(([k,l]) => `<button class="chip" data-act="chip" data-key="tareas" data-v="${k}" aria-pressed="${f===k}">${l}</button>`).join("")}</span><button class="btn pri" data-act="new-ot">+ Nueva OT</button></div>`

  </div>`;

/* ===== Medidores: odometro de cada equipo y cuanto falta para su proxima mantencion ===== */
function vMedidores(){
  const f = S.f.medidores;
  const all = D.camiones.map(c => ({c, p:prev(c)})).filter(x => match(x.c.pat, x.c.marca, x.c.tipo, x.c.base));
  const n = k => all.filter(x => x.p.st === k).length;
  const list = all.filter(x => f === "todos" || x.p.st === f).sort((a,b) => (a.p.kmR??1e12)-(b.p.kmR??1e12) || a.c.pat.localeCompare(b.c.pat));
  const h = `<div class="stk"><div class="chips" style="margin-bottom:6px">${[["todos","Todos",all.length],["vencido","Vencidos",n("vencido")],["proximo","Próximos",n("proximo")],["ok","Al día",n("ok")],["sin","Sin plan",n("sin")]].map(([k,l,c]) => `<button class="chip" data-act="chip" data-key="medidores" data-v="${k}" aria-pressed="${f===k}">${l} · ${c}</button>`).join("")}</div><div class="sub">Odómetro de cada equipo y cuánto falta para su próxima mantención, según su pauta. Ordenados del que está más cerca.</div></div>`;
  if (!all.length) return h + emptyMsg(D.camiones.length ? "Ningún equipo coincide." : "Sin equipos registrados.", demoBtns);
  const corto = t => t.replace(/^MANTENIMIENTO PROGRAMADO\s*/i,"Programado ").replace(/^MANTENCIÓN\s*/i,"");
  const col = st => st === "vencido" ? "var(--red)" : st === "proximo" ? "var(--amber)" : "var(--green)";
  const barra = (nombre, st, kmR, cada, nk, ult) => {
    const usado = cada ? Math.max(0, Math.min(100, Math.round((1 - kmR / cada) * 100))) : 0;
    return `<div><div style="display:flex;justify-content:space-between;gap:8px;font-size:13px"><span>${esc(nombre)}</span><b style="color:${col(st)}">${kmR<=0?`pasada por ${fkm(-kmR)}`:`faltan ${fkm(kmR)}`}</b></div><div style="height:6px;border-radius:4px;background:var(--line);margin:3px 0"><div style="height:6px;border-radius:4px;width:${usado}%;background:${col(st)}"></div></div><div class="ks"><span>Próxima a los ${fkm(nk)}</span>${ult!=null?`<span>Última a los ${fkm(ult)}</span>`:""}</div></div>`;
  };
  return h + `<div class="mgrid" style="margin-top:8px">${list.map(({c,p}) => {
    const lbl = {vencido:["Vencido","red"],proximo:["Próximo","amber"],ok:["Al día","green"],sin:["Sin plan","gray"]}[p.st], q = parDe(c);
    const reg = p.tareas.filter(t => t.st !== "sinreg").sort((a,b) => a.kmR - b.kmR), sinreg = p.tareas.length - reg.length;
    const filas = p.tareas.length ? reg.slice(0,4).map(t => barra(corto(t.tarea.nombre), t.st, t.kmR, t.tarea.cadaKm, t.nk, t.last.km)).join("")
      : (p.nk != null ? barra("Mantención cada "+fkm(c.intKm), p.st, p.kmR, c.intKm, p.nk, c.ultKm) : "");
    return `<div class="kc ${p.st==="vencido"?"flag":p.st==="proximo"?"warn":""}">
      <div style="display:flex;justify-content:space-between;gap:8px;align-items:center"><b style="font-size:16px">Odómetro ${esc(c.tipo||"Equipo")} ${esc(c.pat)}</b>${tag(lbl[0],lbl[1])}</div>
      <div style="display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px"><span style="color:var(--blue)">Último valor:</span><b>${fkm(c.km)}</b><span style="color:var(--blue)">Última fecha:</span><span>${c.kmFecha?fdate(c.kmFecha):"—"}</span><span style="color:var(--blue)">Activo:</span><span>${esc(c.pat)} ${esc(c.marca||c.tipo||"")}${c.base?` · ${esc(c.base)}`:""}</span>${q?`<span style="color:var(--blue)">${etiquetaPar(c)}:</span><span>${esc(q.pat)}</span>`:""}</div>
      ${filas || `<div class="ks">Sin pauta ni última mantención registrada</div>`}
      ${sinreg?`<div class="ks">${sinreg} tarea${sinreg===1?"":"s"} de su pauta sin registro</div>`:""}
      <div class="kact"><button class="btn sm" data-act="edit-cam" data-id="${esc(c.pat)}">Editar</button><button class="btn sm" data-act="hist" data-id="${esc(c.pat)}">Historial</button></div></div>`;
  }).join("")}</div>`;
}

function vPrev(){
  const f = S.f.prev;
  const all = D.camiones.map(c => ({c, p:prev(c)}));
  const n = k => all.filter(x => x.p.st === k).length;
  const cumple = st => f==="todos" || (f==="pendientes" ? (st==="vencido"||st==="proximo") : st===f);
  const stPar = c => { const q = parDe(c); return q ? prev(q).st : null; };
  const list = all.filter(x => (cumple(x.p.st) || (f!=="todos" && f!=="ok" && stPar(x.c) && cumple(stPar(x.c)))) && (match(x.c.pat, x.c.marca) || (S.q.trim() && x.c.par && match(x.c.par))));
  const ord = {vencido:0, proximo:1, ok:2, sin:3};
  const h = `<div class="chips">${[["pendientes","Pendientes",n("vencido")+n("proximo")],["vencido","Vencidos",n("vencido")],["proximo","Próximos",n("proximo")],["ok","Al día",n("ok")],["todos","Todos",all.length]].map(([k,l,c]) => `<button class="chip" data-act="chip" data-key="prev" data-v="${k}" aria-pressed="${f===k}">${l} · ${c}</button>`).join("")}</div>`;
  if (!all.length) return h + emptyMsg("Agrega camiones con su última mantención e intervalo para ver el preventivo.", demoBtns);
  if (!list.length) return h + emptyMsg(f==="pendientes" && !S.q.trim() ? "Sin mantenciones pendientes: todo está al día." : "Ningún camión coincide.");
  const barra = S.sel.size ? `<div class="chips" style="justify-content:space-between;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)"><b>${S.sel.size} equipo${S.sel.size===1?"":"s"} seleccionado${S.sel.size===1?"":"s"}: ${esc([...S.sel].join(" + "))}</b><span style="display:flex;gap:8px"><button class="btn pri" data-act="gen-sel">Generar una sola OT</button><button class="btn" data-act="sel-clear">Limpiar</button></span></div>` : `<div class="sub" style="margin-top:8px">Marca con el check los equipos que irán juntos (por ejemplo un tracto y su semi) y genera una sola OT.</div>`;
  const ordenado = list.sort((a,b) => ord[a.p.st]-ord[b.p.st] || (a.p.kmR??1e9)-(b.p.kmR??1e9)), vistos = new Set(), grupos = [];
  ordenado.forEach(x => { if (vistos.has(x.c.pat)) return; const qd = parDe(x.c), q = qd && ordenado.find(y => y.c === qd);
    const par = q && !vistos.has(q.c.pat) ? (esTractoC(x.c) ? [x, q] : [q, x]) : [x]; par.forEach(y => { vistos.add(y.c.pat); grupos.push(y); }); });
  return h + barra + grupos.map(({c,p}) => {
    const lbl = {vencido:["Vencido","red"],proximo:["Próximo","amber"],ok:["Al día","green"],sin:["Sin plan","gray"]}[p.st];
    const due = p.tareas.filter(t => t.st === "vencido" || t.st === "proximo");
    const trq = parDe(c), arr = !!(trq && !due.length && ["vencido","proximo"].includes(prev(trq).st));
    const sinreg = p.tareas.filter(t => t.st === "sinreg").length;
    const corto = n => n.replace(/^MANTENIMIENTO PROGRAMADO\s*/i,"Programado ").replace(/^MANTENCIÓN\s*/i,"");
    const lineas = p.tareas.filter(t => t.st !== "sinreg").sort((a,b) => a.kmR - b.kmR).slice(0,4).map(t => `<span>${tag(t.st==="vencido"?"Vencida":t.st==="proximo"?"Próxima":"Al día", t.st==="vencido"?"red":t.st==="proximo"?"amber":"green")} ${esc(corto(t.tarea.nombre))}: ${t.kmR<=0?`pasada por ${fkm(-t.kmR)}`:`faltan ${fkm(t.kmR)}`}</span>`).join("");
    return `<div class="row ${p.st==="vencido"?"flag":p.st==="proximo"?"warn":""}">
      <div><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" data-act="sel" data-id="${esc(c.pat)}"${S.sel.has(c.pat)?" checked":""} style="width:20px;height:20px"><span class="plate">${esc(c.pat)}</span></label></div>
      <div class="what"><div class="d">${tag(lbl[0],lbl[1])} ${esc(c.marca||c.tipo||"")}${arr?" "+tag("Se arrastra con el "+(esTractoC(trq)?"tracto ":"semi ")+trq.pat,"amber"):""}</div>
        <div class="m">${p.tareas.length ? lineas : `${p.kmR!=null?`<span>${p.kmR<=0?`Pasado por ${fkm(-p.kmR)}`:`Faltan ${fkm(p.kmR)}`} (próx. ${fkm(p.nk)})</span>`:""}${p.dR!=null?`<span>${p.dR<0?`Vencido hace ${-p.dR} días`:`Faltan ${p.dR} días`} (${fdate(p.nd)})</span>`:""}`}${p.st==="sin"?`<span>${(c.pautaIds||[]).length?"Registra la última mantención de cada tarea (botón de la derecha)":"Asigna una pauta en Pautas o define el intervalo en Editar"}</span>`:""}${sinreg&&p.tareas.length?`<span>${sinreg} tarea${sinreg===1?"":"s"} sin registro</span>`:""}<span>Km actual ${fkm(c.km)}</span>${c.par?`<span><b>${etiquetaPar(c)} ${esc(c.par)}</b> <small>(aparte, con su propia pauta y OT)</small></span>`:""}</div></div>
      <div class="acts">${due.length?`<button class="btn sm pri" data-act="gen-ot" data-id="${esc(c.pat)}">Generar OT${due.length>1?` (${due.length} tareas)`:""}</button>`:arr?`<button class="btn sm pri" data-act="gen-ot-arr" data-id="${esc(c.pat)}">Generar OT (con ${esc(trq.pat)})</button>`:""}<button class="btn sm" data-act="hecha" data-id="${esc(c.pat)}">Registrar mantención hecha</button></div></div>`;
  }).join("");

/** Asigna a cada camión los planes según la lista de activos vinculados que trae Fracttal */
function asignarFracttal(){
  const faltan = new Set();
  D.pautas.forEach(p => (p.activos||[]).forEach(id => { if (!camion(id)) faltan.add(id); }));
  let crear = false;
  if (faltan.size) crear = confirm(`${faltan.size} equipos de Fracttal no están en el tablero. ¿Crearlos (sin km hasta que los ingreses)?`);
  let n = 0;
  D.pautas.forEach(p => (p.activos||[]).forEach(id => {
    let c = camion(id);
    if (!c && crear){ c = {pat:id, marca:"", base:"", tipo:(p.tipo==="Estanque"?"":p.tipo), km:null, estado:"operativo", intKm:10000, intDias:90, pautaIds:[], mant:{}}; D.camiones.push(c); }
    if (!c) return;
    c.pautaIds = c.pautaIds || [];
    if (!c.pautaIds.includes(p.id)){ c.pautaIds.push(p.id); n++; }
    if (!c.tipo && p.tipo && p.tipo !== "Estanque") c.tipo = p.tipo;
  }));
  save(); render(); alert(`${n} asignaciones de planes aplicadas.`);
}
const RES = t => t==="sino" ? [["si","Sí"],["no","No"],["na","N/A"]] : [["apf","Aprobó"],["alerta","Alerta"],["fallo","Falló"]];
const grupoDe = (p, t) => `${p.nombre.replace(/^FLOTA\s*-?\s*(PLAN|PAUTA)\s+(DE\s+)?MANTEN[A-Z]+\s+/i,"")} · ${t.nombre}`;
/** Las tareas cíclicas de Fracttal marcan en qué ciclos aplica cada ítem (ciclo n = n × cada km) */
function itemsPara(t){
  const its = t.tarea.items, maxIt = Math.max(0, ...its.flatMap(i => i.it || []));
  if (!maxIt || !t.tarea.cadaKm || t.nk == null) return its;
  const n = Math.max(1, Math.round(t.nk / t.tarea.cadaKm)), nn = ((n - 1) % maxIt) + 1;
  return its.filter(i => !i.it || i.it.includes(nn));
}
/** Tareas de un equipo para la OT, con SU pauta (vencidas/proximas; si no hay, la siguiente de su plan). */
function parteOT(c){
  const pv = prev(c);
  let due = pv.tareas.filter(t => t.st === "vencido" || t.st === "proximo");
  if (!due.length){
    const r = pv.tareas.filter(t => t.st !== "sinreg").sort((x,y) => x.kmR - y.kmR)[0] || pv.tareas.find(t => t.primaria) || pv.tareas[0];
    if (r) due = [r];
  }
  if (!due.length) return {c, error:"no tiene una pauta asignada (asígnala en Pautas)"};
  const keys = due.map(t => t.key);
  const ya = D.ots.find(o => otAbierta(o) && otKeys(o, c.pat).some(k => keys.includes(k)));
  if (ya) return {c, error:`ya está en la OT abierta #${ya.id}`};
  const items = [];
  due.forEach(t => { const g = grupoDe(t.plan, t.tarea);
    const its = itemsPara(t);
    if (its.length) its.forEach(i => items.push({eq:c.pat, grupo:g, sis:i.sis, desc:i.desc, tipo:i.tipo, res:null}));
    else items.push({eq:c.pat, grupo:g, sis:"GENERAL", desc:"Realizar "+t.tarea.nombre+" (checklist aún no cargado en el plan)", tipo:"sino", res:null}); });
  return {c, due, keys, items};
}

    <div class="btns" style="flex-wrap:wrap"><button type="button" class="btn" data-v>Volver al checklist</button><button type="button" class="btn" data-sin>Cerrar sin crear OT</button><button class="btn pri">Cerrar y crear OT correctiva</button></div></form>`;
  const fm = dlg.querySelector("form");

  fm.querySelector("[data-sin]").onclick = () => {
    if (!confirm(`¿Cerrar la OT #${o.id} sin crear una OT correctiva?\n\nQuedará registrado que se cerró con ${txtHz(hz)} sin OT, y aparecerá en "Requiere atención" del Dashboard.`)) return;
    o.hallazgos = {fallos:nHz(hz,"fallo"), alertas:nHz(hz,"alerta"), decision:"sin", fecha:hoy()}; fin();
  };
  fm.onsubmit = e => {

    const id = crearOTHallazgos(o, sel, fm.elements.resp.value, fm.elements.vence.value || addDays(hoy(), 3));
    o.hallazgos = {fallos:nHz(hz,"fallo"), alertas:nHz(hz,"alerta"), decision:"ot", otId:id, fecha:hoy()}; fin();
  };
}
function crearOTHallazgos(o, hz, resp, vence){
  const pats = [...new Set(hz.map(x => x.it.eq || o.pat))], fallo = hz.some(x => x.it.res === "fallo"), nf = nHz(hz,"fallo"), na = nHz(hz,"alerta");
  const items = hz.map(x => ({eq:x.it.eq || o.pat, grupo:x.it.grupo, sis:x.it.sis, desc:x.it.desc, tipo:x.it.tipo, res:null, desde:x.it.res}));
  const id = nid();
  const ot = {id, pat:pats[0], tipo:"correctivo", desc:`Hallazgos de la OT #${o.id}: ${[nf?nf+" fallo"+(nf>1?"s":""):"", na?na+" alerta"+(na>1?"s":""):""].filter(Boolean).join(" y ")}`,
    prioridad: fallo ? "Alta" : "Media", resp, estado:"abierta", creada:hoy(), vence, cerrada:null, costo:null, notas:`Origen: OT #${o.id}`, origenOT:o.id, items};
  if (pats.length > 1) ot.equipos = pats.map(p => ({pat:p, keys:[], kmOT:(camion(p)||{}).km, desc:"Hallazgos"}));

}

  const pintar = () => {
    let f = 0, a = 0;
    fm.querySelectorAll(".ckrow").forEach(r => { const c = r.querySelector("input[type=radio]:checked"), v = c ? c.value : ""; if (v === "fallo") f++; if (v === "alerta") a++;

    b.textContent = `${[f ? f + (f===1?" fallo":" fallos") : "", a ? a + (a===1?" alerta":" alertas") : ""].filter(Boolean).join(" y ")} en este checklist. Al cerrar la OT te pediremos crear una OT correctiva.`;
  };
  fm.addEventListener("change", pintar); pintar();

dlg.addEventListener("close", () => { dlg.style.width = ""; });
/** Al cerrar una OT con tareas de plan, el camión queda con esas mantenciones al día */
function alCerrar(o){
  (o.equipos || [{pat:o.pat, keys:o.keys, kmOT:o.kmOT}]).forEach(e => {
    const c = camion(e.pat); if (!c || !(e.keys||[]).length) return;
    c.mant = c.mant || {};
    const km = c.km != null ? c.km : e.kmOT;
    e.keys.forEach(k => { c.mant[k] = {fecha:o.cerrada || hoy(), km:km || 0}; });
    if (c.estado === "taller") c.estado = "operativo";
  });
}

function vCostos(){
  const items = [
    ...D.gastos.map(g => ({fecha:g.fecha, pat:g.pat, concepto:g.concepto, monto:g.monto||0, g})),
    ...D.ots.filter(o => o.costo && o.cerrada).map(o => ({fecha:o.cerrada, pat:o.pat, concepto:`OT #${o.id}: ${o.desc}`, monto:o.costo})),
  ].filter(i => match(i.pat, i.concepto)).sort((a,b) => b.fecha.localeCompare(a.fecha));
  const byMes = {}, byCam = {};
  items.forEach(i => { byMes[i.fecha.slice(0,7)] = (byMes[i.fecha.slice(0,7)]||0)+i.monto; byCam[i.pat] = (byCam[i.pat]||0)+i.monto; });
  const meses = Object.entries(byMes).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);

  if (!items.length) return h + emptyMsg("Sin gastos registrados.");

  return h + `<div class="grid2">
    <div class="panel"><h3>Por mes</h3><div class="bars">${meses.map(([m,v]) => `<div class="b" style="grid-template-columns:80px 1fr 92px"><span>${mlabel(m)}</span><span class="t"><i style="width:${v*100/mxM}%"></i></span><b>${fclp(v)}</b></div>`).join("")}</div></div>
    <div class="panel"><h3>Por camión</h3><div class="bars">${cams.slice(0,8).map(([p,v]) => `<div class="b" style="grid-template-columns:80px 1fr 92px"><span>${esc(p)}</span><span class="t"><i style="width:${v*100/mxC}%"></i></span><b>${fclp(v)}</b></div>`).join("")}</div></div></div>
  <div class="panel"><h3>Detalle</h3><div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Fecha</th><th>Camión</th><th>Concepto</th><th class="r">Monto</th><th></th></tr></thead><tbody>
    ${items.map(i => `<tr><td>${fdate(i.fecha)}</td><td><span class="plate">${esc(i.pat)}</span></td><td>${esc(i.concepto)}</td><td class="r">${fclp(i.monto)}</td><td class="r">${i.g?`<button class="btn sm" data-act="edit-gasto" data-id="${i.g.id}">Editar</button> <button class="btn sm danger" data-act="del-gasto" data-id="${i.g.id}">Eliminar</button>`:""}</td></tr>`).join("")}
  </tbody></table></div></div>`;
}

function vHist(pat){

/* ================= Render ================= */
function render(){
  if (BASE_FIJA) S.base = BASE_FIJA;
  const full = D;
  if (S.base === "-") S.base = "";
  const bases = [...new Set([...BASES_FLOTA, ...full.camiones.map(c => c.base).filter(Boolean)])];
  const sel = document.getElementById("base");
  sel.innerHTML = `<option value="">Todas las bases</option>` + bases.map(b => `<option value="${esc(b)}"${S.base===b?" selected":""}>${esc(b)}</option>`).join("");
  if (BASE_FIJA){ sel.innerHTML = `<option value="${esc(BASE_FIJA)}" selected>${esc(BASE_FIJA)}</option>`; sel.disabled = true; }
  if (S.base){
    const ok = c => S.base === "-" ? !c.base : c.base === S.base;
    const cams = full.camiones.filter(ok), pats = new Set(cams.map(c => c.pat));
    D = {...full, camiones:cams, ots:full.ots.filter(o => otPats(o).some(p => pats.has(p))), fallas:full.fallas.filter(f => pats.has(f.pat)), gastos:full.gastos.filter(g => pats.has(g.pat))};
  }
  try{
    const ab = D.ots.filter(otAbierta).length;
    document.getElementById("tabs").innerHTML = TABS.map(([k,l]) => `<button class="tab" role="tab" data-act="tab" data-tab="${k}" aria-selected="${S.tab===k}">${l}${k==="tareas"&&ab?` <span class="c">${ab}</span>`:""}${k==="solicitudes"&&D.fallas.some(x=>x.ext&&x.nueva)?` <span class="c">${D.fallas.filter(x=>x.ext&&x.nueva).length}</span>`:""}</button>`).join("");
    document.getElementById("q").style.display = S.tab === "resumen" ? "none" : "";
    document.querySelectorAll(".wrap").forEach(w => { w.style.maxWidth = (S.tab === "tareas" || S.tab === "medidores") ? "1900px" : S.tab === "resumen" ? "1500px" : ""; });
    try{ const br = document.querySelector("header");   // el alto del encabezado fijo se mide solo y se mantiene al día
      if (br && !window.__roBar){ const fija = () => document.documentElement.style.setProperty("--bh", br.offsetHeight + "px"); fija();
        if (window.ResizeObserver){ window.__roBar = new ResizeObserver(fija); window.__roBar.observe(br); } else window.__roBar = true; }
    }catch(e){}
    const vw = document.getElementById("view"); vw.innerHTML = {resumen:vResumen, camiones:vCamiones, tareas:vTareas, medidores:vMedidores, solicitudes:() => vFallas(true), pautas:vPautas, fallas:() => vFallas(false), costos:vCostos}[S.tab](); entradaVista(vw);
  } finally { D = full; }
  revisarAlertasMant();
  document.getElementById("foot").textContent = `Datos compartidos (Google Drive) · ${full.camiones.length} camiones · ${full.ots.length} OTs${S.base ? ` · mostrando ${S.base==="-"?"equipos sin base":S.base}` : ""}${EMAIL?` · ${EMAIL} (${ROL})`:""}${ESTADO?` · ${ESTADO}`:""}`;
  aplicarRol();
}
document.addEventListener("change", e => { if (e.target && e.target.id === "per"){ S.per = e.target.value; render(); } });

/* ===== Alerta de mantenimiento al ingresar km ===== */
function snapshotMant(){
  const m = {};
  const visible = c => !S.base || (S.base === "-" ? !c.base : c.base === S.base);
  D.camiones.forEach(c => { if (!esRaiz(c)) return; const p = prev(c), v = visible(c);
    if (p.tareas.length) p.tareas.forEach(t => { m[c.pat+"|"+t.key] = {st:t.st, pat:c.pat, tarea:t.tarea.nombre, kmR:t.kmR, visible:v}; });
    else m[c.pat+"|gen"] = {st:p.st, pat:c.pat, tarea:"Mantención (intervalo propio)", kmR:p.kmR, visible:v}; });
  return m;
}
function estadoGuardado(){
  try{ const s = JSON.parse(localStorage.getItem("mant_estado_"+(USUARIO||"local")) || "null"); if (!s) return null; const o = {}; Object.keys(s).forEach(k => { o[k] = {st:s[k]}; }); return o; }catch(e){ return null; }
}
function guardarEstado(m){
  try{ const s = {}; Object.keys(m).forEach(k => { s[k] = m[k].st; }); localStorage.setItem("mant_estado_"+(USUARIO||"local"), JSON.stringify(s)); }catch(e){}
}
function revisarAlertasMant(){
  const ahora = snapshotMant(), antes = ESTADO_ANT; ESTADO_ANT = ahora; guardarEstado(ahora);
  if (!antes) return;
  const nuevas = Object.keys(ahora).filter(k => ahora[k].visible && (ahora[k].st === "vencido" || ahora[k].st === "proximo") && (!antes[k] || antes[k].st !== ahora[k].st));
  if (nuevas.length) setTimeout(() => mostrarAlertasMant(nuevas.map(k => ahora[k])), 80);
}
function mostrarAlertasMant(lista){
  const corto = n => String(n).replace(/^MANTENIMIENTO PROGRAMADO\s*/i,"Programado ").replace(/^MANTENCIÓN\s*/i,"");
  const venc = lista.filter(x => x.st === "vencido"), prox = lista.filter(x => x.st === "proximo");
  const fila = x => { const cc = camion(x.pat); let extra = "";
    if (cc && cc.par){ const q = parDe(cc), rol = etiquetaPar(cc);
      if (q){ const pq = prev(q), ts = pq.tareas.filter(t => t.st !== "sinreg").sort((p,r) => p.kmR - r.kmR), t = ts[0];
        extra = `<div style="margin-left:6px;color:var(--muted,#667)">↳ ${rol} <b>${esc(q.pat)}</b> se arrastra con su unidad (su propia pauta y OT): ${t ? esc(corto(t.tarea.nombre)) + (t.kmR<=0 ? ` — pasada por ${fkm(-t.kmR)}` : ` — faltan ${fkm(t.kmR)}`) : ST_PREV_TXT[pq.st]}</div>`; } }
    return `<li><b>${esc(x.pat)}</b> · ${esc(corto(x.tarea))}${x.kmR==null?"":x.kmR<=0?` — pasada por ${fkm(-x.kmR)}`:` — faltan ${fkm(x.kmR)}`}${extra}</li>`; };
  const bloque = (arr, cls, txt) => arr.length ? `<div style="margin-top:10px"><span class="tag ${cls}">${txt} · ${arr.length}</span><ul style="margin:6px 0 0;padding-left:18px;font-size:14px;display:grid;gap:3px">${arr.slice(0,14).map(fila).join("")}${arr.length>14?`<li>… y ${arr.length-14} más</li>`:""}</ul></div>` : "";
  dlg.style.width = "min(560px,96vw)";
  dlg.innerHTML = `<form><h2>⚠ Equipos listos para mantenimiento</h2><div class="sub">Con los km actualizados, según las pautas, estos equipos ya llegaron o están por llegar a su mantención (cambios desde tu última visita).</div>
    ${bloque(venc,"red","Ya les toca")}${bloque(prox,"amber","Próximos (menos de 1.000 km)")}
    <div class="btns" style="margin-top:14px"><button type="button" class="btn" data-x>Cerrar</button><button type="button" class="btn pri" data-y>Ver tareas pendientes</button></div></form>`;
  dlg.querySelector("[data-x]").onclick = () => dlg.close();
  dlg.querySelector("[data-y]").onclick = () => { dlg.close(); go("tareas"); };
  dlg.showModal();
}

/* ================= Eventos ================= */
const byId = (arr, id) => arr.find(x => String(x.id) === String(id));
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  if (!permitido(a)){ alert("Tu rol ("+ROL+") no permite esta acción."); return; }
  if (a === "tab") go(b.dataset.tab);
  else if (a === "go") go(b.dataset.tab, b.dataset.f);
  else if (a === "go-camiones") go("camiones");
  else if (a === "chip"){ S.f[b.dataset.key] = b.dataset.v; render(); }
  else if (a === "new-cam") fCamion();
  else if (a === "edit-cam") fCamion(camion(id));
  else if (a === "del-cam"){ if (confirm(`¿Eliminar ${id}? Sus órdenes, fallas y gastos se mantienen en el historial.`)){ D.camiones = D.camiones.filter(c => c.pat !== id); save(); render(); } }
  else if (a === "hist") vHist(id);
  else if (a === "hecha") fHecha(camion(id));
  else if (a === "new-ot") fOT();
  else if (a === "edit-ot"){ const o = byId(D.ots, id); if (o && otAbierta(o)) fOT(o); }
  else if (a === "close-ot"){ const o = byId(D.ots, id);
    if (o.items && o.items.some(i => i.tipo !== "texto" && !i.res) && !confirm("Esta OT tiene ítems del checklist sin responder. ¿Cerrar igual?")) return;
    cerrarOT(o); }
  else if (a === "ver-ot"){ const o = byId(D.ots, id); if (o) verOT(o); }
  else if (a === "checklist"){ const o = byId(D.ots, id); if (o && otAbierta(o)) fChecklist(o); }
  else if (a === "gen-ot" || a === "gen-ot-arr"){ const c = camion(id), q = parDe(c); generarOTs(q ? (esTractoC(c) ? [id, q.pat] : [q.pat, id]) : [id]); }
  else if (a === "sel"){ const c = camion(id); if (b.checked){ S.sel.add(id); const q = parDe(c); if (q) S.sel.add(q.pat); } else S.sel.delete(id); render(); }
  else if (a === "ot-estado"){ const o = byId(D.ots, id); if (o && otAbierta(o)){ o.estado = b.dataset.v; save(); render(); } }
  else if (a === "gen-sel") generarOTs([...S.sel]);
  else if (a === "sel-clear"){ S.sel.clear(); render(); }
  else if (a === "new-pauta") fPlan();
  else if (a === "edit-pauta") fPlan(D.pautas.find(p => p.id === id));
  else if (a === "ft-asignar") asignarFracttal();
  else if (a === "meta"){ const v = prompt("Meta de cumplimiento de OTs a tiempo (%)", D.meta || 80); const n = Number(String(v).replace(",",".")); if (v !== null && n > 0 && n <= 100){ D.meta = Math.round(n); save(); render(); } }
  else if (a === "base"){ S.base = (S.base === id ? "" : id); guardarUI(); render(); }
  else if (a === "per"){ S.per = id; FORZAR_ENTRADA = true; render(); }
  else if (a === "mecanicos") fMecanicos();
  else if (a === "um-imp") document.getElementById("um").click();
  else if (a === "um-apply") aplicarUM();
  else if (a === "del-pauta"){ if (confirm("¿Eliminar esta pauta? Los camiones que la usan quedan sin pauta.")){ D.pautas = D.pautas.filter(p => p.id !== id); D.camiones.forEach(c => { c.pautaIds = (c.pautaIds||[]).filter(x => x !== id); }); save(); render(); } }
  else if (a === "del-ot"){ const o = byId(D.ots, id); if (o && !otAbierta(o)) return; if (confirm("¿Eliminar esta orden de trabajo?")){ D.ots = D.ots.filter(o => String(o.id) !== id); save(); render(); } }
  else if (a === "new-falla") fFalla();
  else if (a === "edit-falla") fFalla(byId(D.fallas, id));
  else if (a === "del-falla"){ if (confirm("¿Eliminar esta falla?")){ D.fallas = D.fallas.filter(x => String(x.id) !== id); save(); render(); } }
  else if (a === "new-gasto") fGasto();
  else if (a === "edit-gasto") fGasto(byId(D.gastos, id));
  else if (a === "del-gasto"){ if (confirm("¿Eliminar este gasto?")){ D.gastos = D.gastos.filter(g => String(g.id) !== id); save(); render(); } }
  else if (a === "sync") sincronizar();
  else if (a === "sync-cfg") fSync();
  else if (a === "falla-ot"){ const x = byId(D.fallas, id); const oid = nid();
    D.ots.push({id:oid, pat:x.pat, tipo:"correctivo", desc:"Falla: "+x.desc, prioridad:SEV.includes(x.severidad)?x.severidad:"Media", resp:"", estado:"abierta", creada:hoy(), vence:addDays(hoy(), x.opera==="No"?1:3), cerrada:null, costo:null});
    x.otId = oid; x.nueva = false; save(); render(); }
  else if (a === "clave") fClave();
  else if (a === "salir") salir();
  else if (a === "demo") demo();
  else if (a === "export") exportar();
  else if (a === "import") document.getElementById("file").click();
});
document.getElementById("q").addEventListener("input", e => { S.q = e.target.value; render(); });
document.getElementById("file").addEventListener("change", e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try{ const s = JSON.parse(r.result); if (!s.camiones) throw 0; if (confirm("Esto reemplaza los datos actuales. ¿Continuar?")){ D = Object.assign(EMPTY(), s); ESTADO_ANT = null; save(); render(); } }catch(_){ alert("Archivo de respaldo no válido."); } };
  r.readAsText(f); e.target.value = "";
});
/* ===== Observaciones de conductores: se leen directo del servidor ===== */
function syncCfg(){ return {url:true}; }
function fSync(){}
function sincronizar(){
  google.script.run
    .withSuccessHandler(j => {
      const conocidos = new Set(D.fallas.map(f => f.ext).filter(Boolean)); let n = 0;
      j.items.forEach(it => { if (conocidos.has(it.id)) return;
        const pat = normId(it.equipo) || it.equipo;
        D.fallas.push({id:nid(), ext:it.id, fecha:(it.fecha||"").slice(0,10) || hoy(), pat, desc:it.desc, severidad:SEV.includes(it.severidad)?it.severidad:"Media", reportado:it.conductor, solucion:"", opera:it.opera, nueva:true});
        const cam = camion(pat); if (cam && it.km != null && it.km > (cam.km||0)){ cam.km = it.km; cam.kmFecha = (it.fecha||"").slice(0,10) || hoy(); }
        if (cam && it.opera === "No" && cam.estado === "operativo") cam.estado = "detenido";
        n++; });
      save(); S.tab = "solicitudes"; render();
      alert(n ? `${n} observaciones nuevas de conductores.` : "Sin observaciones nuevas.");
    })
    .withFailureHandler(e => alert("No pude leer las observaciones: "+(e && e.message ? e.message : e)))
    .leerObservaciones(TOKEN);
}

/* ===== Importar últimas mantenciones (archivo fracttal_ultimas_mantenciones.json) ===== */
let UM = null;
const normTarea = t => String(t||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase().replace(/\bKMS?\b/g,"").replace(/\s+/g," ").trim();
document.getElementById("um").addEventListener("change", e => {
  const f = e.target.files[0]; e.target.value = ""; if (!f) return;
  const r = new FileReader();
  r.onload = () => { try{ leerUM(JSON.parse(r.result)); }catch(err){ alert("Archivo no válido: "+err.message); } };
  r.readAsText(f);
});
function leerUM(j){
  if (!j || !Array.isArray(j.items)) throw new Error("falta la lista items");
  const ok = [], sinEq = [], sinPlan = [], viejos = [], modelos = [];
  j.items.forEach(it => {
    const id = normId(it.equipo); let c = camion(id), esNuevo = false;
    if (it.modelo !== undefined && !it.tarea){ if (!c) sinEq.push(id); else if (!c.marca) modelos.push({id, modelo:it.modelo}); return; }   // marca y modelo de cada equipo
    if (!c){ c = {pat:id, pautaIds:[], mant:{}}; esNuevo = true; }
    const nt = normTarea(it.tarea);
    const buscar = ids => { for (const pid of ids){ const p = pautaPorId(pid); if (!p) continue; const t = p.tareas.find(x => normTarea(x.nombre) === nt); if (t) return {p, t}; } return null; };
    let hit = buscar(c.pautaIds || []), nuevoPlan = false;
    if (!hit){ const cand = D.pautas.filter(p => p.tareas.some(x => normTarea(x.nombre) === nt));
      if (cand.length === 1){ hit = buscar([cand[0].id]); nuevoPlan = true; } }
    if (!hit){ sinPlan.push(id+" ("+it.tarea+")"); return; }
    const key = hit.p.id + "/" + hit.t.id, prevR = c.mant && c.mant[key];
    if (it.quitar){ if (prevR) ok.push({id, key, plan:hit.p, tarea:hit.t, quitar:true}); return; }   // retira una lectura errónea
    if (prevR && prevR.fecha >= it.fecha){ viejos.push(id); return; }
    ok.push({id, key, plan:hit.p, tarea:hit.t, fecha:it.fecha, km:it.km, actual:it.medidorActual, nuevoPlan, esNuevo});
  });
  UM = {ok, modelos, leido:j.leido};
  const L = (arr, fn, max=10) => arr.length ? `<ul style="margin:4px 0 10px;padding-left:18px;font-size:13px">${arr.slice(0,max).map(fn).join("")}${arr.length>max?`<li>… y ${arr.length-max} más</li>`:""}</ul>` : "";
  dlg.innerHTML = `<form><h2>Importar últimas mantenciones</h2>
    <div class="sub" style="margin-bottom:8px">${j.items.length} registros del archivo${j.leido?` (leído el ${esc(j.leido)})`:""}. El km es el del odómetro cuando Fracttal activó la tarea, una aproximación de la última mantención.</div>
    ${modelos.length?`<div><b>${modelos.length}</b> equipos sin modelo recibirán su marca y modelo${L(modelos, x => `<li>${esc(x.id)}: ${esc(x.modelo)}</li>`, 6)}</div>`:""}
    ${ok.length||!modelos.length?`<div><b>${ok.length}</b> mantenciones por registrar${L(ok, x => `<li>${esc(x.id)}: ${esc(x.tarea.nombre)} · ${x.quitar?"se retira la lectura errónea":fkm(x.km)+" · "+fdate(x.fecha)}${x.nuevoPlan?" · se asigna el plan":""}${x.esNuevo?" · equipo nuevo":""}</li>`)}</div>`:""}
    ${sinEq.length?`<div class="sub"><b>${sinEq.length}</b> equipos del archivo no están en el tablero: ${esc([...new Set(sinEq)].slice(0,12).join(", "))}${sinEq.length>12?"…":""}</div>`:""}
    ${sinPlan.length?`<div class="sub"><b>${sinPlan.length}</b> sin plan que coincida (asígnales su plan en Pautas): ${esc(sinPlan.slice(0,6).join("; "))}${sinPlan.length>6?"…":""}</div>`:""}
    ${viejos.length?`<div class="sub">${viejos.length} ya tenían una mantención igual o más reciente y no se cambian.</div>`:""}
    <div class="btns"><button type="button" class="btn" data-x>Cancelar</button><button type="button" class="btn pri" data-act="um-apply"${ok.length||modelos.length?"":" disabled"}>Aplicar</button></div></form>`;
  dlg.querySelector("[data-x]").onclick = () => dlg.close(); dlg.showModal();
}
function aplicarUM(){
  if (!UM) return;
  UM.ok.forEach(x => { let c = camion(x.id);
    if (x.quitar){ if (c && c.mant) delete c.mant[x.key]; return; }
    if (!c){ c = {pat:x.id, marca:"", base:"", tipo:/RAMPLA/i.test(x.tarea.nombre) ? "Semirremolque" : "", km:null, estado:"operativo", intKm:10000, intDias:90, pautaIds:[], mant:{}}; D.camiones.push(c); }
    c.mant = c.mant || {};
    if (x.nuevoPlan && !(c.pautaIds||[]).includes(x.plan.id)){ c.pautaIds = c.pautaIds || []; c.pautaIds.push(x.plan.id); }
    c.mant[x.key] = {fecha:x.fecha, km:x.km};
    if (x.actual && x.actual > (c.km || 0)){ c.km = x.actual; c.kmFecha = UM.leido || hoy(); } });
  const nm = (UM.modelos || []).filter(x => { const c = camion(x.id); if (c && !c.marca){ c.marca = x.modelo; return true; } return false; }).length;
  const n = UM.ok.length; UM = null; save(); dlg.close(); render(); alert((n ? n + " mantenciones registradas. " : "") + (nm ? nm + " equipos con su modelo." : ""));
}

const normId = v => { if (v == null || v === "") return null; const s = String(v).trim(); return /^\d+(\.0+)?$/.test(s) ? String(parseInt(s,10)) : s.toUpperCase(); };

function exportar(){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(D, null, 1)], {type:"application/json"}));
  a.download = `respaldo_mantenimiento_${hoy()}.json`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

    {pat:"DEMO05", marca:"Camión de ejemplo E", km:12000, estado:"operativo", ultFecha:d(-10), ultKm:10000, intKm:10000, intDias:90});
  const ot = (pat,tipo,desc,prioridad,estado,c,v,costo) => D.ots.push({id:nid(), pat, tipo, desc, prioridad, resp:"Taller ejemplo", estado, creada:d(c), vence:d(v), cerrada:estado==="cerrada"?d(v):null, costo});
  ot("DEMO02","correctivo","Cambio de embrague","Alta","proceso",-3,2,null);
  ot("DEMO04","correctivo","Falla de frenos","Muy alta","abierta",-6,-2,null);
  ot("DEMO01","preventivo","Mantención 180.000 km","Media","abierta",-1,5,null);
  ot("DEMO03","preventivo","Cambio de aceite y filtros","Baja","revision",-4,0,185000);
  ot("DEMO05","preventivo","Revisión inicial","Baja","cerrada",-10,-10,90000);
  ot("DEMO03","correctivo","Cambio de neumático","Media","cerrada",-12,-11,240000);
  ot("DEMO01","preventivo","Mantención 170.000 km","Media","cerrada",-95,-95,320000);
  D.fallas.push({id:nid(), fecha:d(-6), pat:"DEMO04", desc:"Pérdida de presión de frenos en ruta", severidad:"Muy alta", reportado:"Conductor", solucion:""},
                {id:nid(), fecha:d(-12), pat:"DEMO03", desc:"Neumático reventado", severidad:"Media", reportado:"Conductor", solucion:"Cambio de neumático"});
  D.gastos.push({id:nid(), fecha:d(-5), pat:"DEMO02", concepto:"Kit de embrague", monto:410000}, {id:nid(), fecha:d(-2), pat:"DEMO04", concepto:"Cañerías de freno", monto:95000});
  save(); render();
}
